              0주차의 "ALTER SYSTEM SET 은 완료 줄을 남기지 않는다" 재확인.
          - |
            Oracle 이 정지 상태에서 스스로 복구를 재시도하고 있었다.
              Deleted file $ORACLE_HOME/dbs/archreact_test_4cf423df.arc
            archreact_test_*.arc 는 archiver 가 "이제 쓸 수 있나" 확인용으로
            만드는 시험 파일이다. 그 흔적이 해소 시점에 삭제로 남는다.
          - |
            해소 직후 활동이 폭발한다.
              15:38:46.557 ARC1 → S-81
              15:38:46.578 ARC2 → S-82
              15:38:46.614 ARC3 → S-83
            밀렸던 3건이 57ms 안에 처리된다.
            → 아카이브 엔트리가 갑자기 몰리면 그 앞에 정체가 있었다는
              역방향 단서로 쓸 수 있다.
          - |
            "db_recovery_file_dest_size of N MB is X% used" 는
            S00 기동 때(36.34%) 단순 정보였고 여기서는(24.24%) 해소 확인 신호다.
            같은 문자열이 문맥에 따라 역할이 달라지는 사례.
            (앞선 사례: cannot allocate new log — S01 무해 / S06 치명)

  - id: S07
    slug: restart-clean
    commands:
      - SHUTDOWN IMMEDIATE
      - STARTUP
    expect:
      events:
        - lifecycle.shutdown_clean
        - lifecycle.instance_start
        - lifecycle.bg_process_start
        - lifecycle.db_mount
        - lifecycle.db_open
      ora_codes: []
      severity_max: notice
      absent:
        - recovery.crash_begin        # ← 없어야 한다. S08 과의 차이가 이것뿐이다
    note: S08 의 대조군. 두 구간의 차집합이 곧 crash recovery 이벤트 정의가 된다.
    verify:
      ran_at: 2026-08-06 15:54:59
      result: 예측 적중. absent 확정 — crash recovery 없음
      region_lines: 439        # 종료 약 150줄 + 기동 약 290줄
      findings:
        - |
          ★★ 정상 종료 로그는 위협적으로 들리는 문구로 가득하다.
            Shutting down instance: further logons disabled
            Process termination requested for pid 218365 ...
            Archiving is disabled
            ARC3 (PID:182845): ARCH shutting down
            ARC3 (PID:182845): Archival stopped
          전부 정상 종료 절차다. 키워드로 severity 를 매기면
          모든 정상 종료가 오탐이 된다.
          ★ 특히 "Archival stopped" — manifest 의 S06 예측에
            "ARCH: Archival stopped, error occurred" 라고 적어뒀는데,
            S06 에서는 그 문자열이 안 나왔고 여기 정상 종료에서 나왔다.
          → S06 과 짝을 이루는 그림:
              S06: 치명적인데 ORA 코드가 없다  (Stuck archiver condition declared)
              S07: 무해한데 무섭게 들린다      (Archival stopped)
            severity 는 코드로도, 키워드로도 정할 수 없다.
        - |
          ★★ "recovery" 키워드 검색이 recovery 0건 구간에서 8건을 잡는다.
            USE_DB_RECOVERY_FILE_DEST        (파라미터 값)
            .../fast_recovery_area/...       (파일 경로)
            db_recovery_file_dest            (파라미터명)
            recovery-related files           (영어 산문)
            Undo initialization recovery ... (정상 기동 절차)
          → 키워드 매칭 실패의 세 번째 방식. 파라미터명·경로·산문이 전부 걸린다.
            매칭은 줄 머리 기준 + 구조 인식으로 해야 한다.
        - |
          ★ 함정: "Undo initialization recovery: err:0 start: N end: N diff: 2 ms"
            정상 기동에도 나오는 줄인데 이름에 recovery 가 들어 있다.
            S08 의 진짜 crash recovery 와 반드시 구분해야 한다.
            진짜 신호는 "Beginning crash recovery of N threads" 다.

  - id: S08
    slug: restart-abort
    commands:
      - 커밋하지 않은 트랜잭션 생성
      - SHUTDOWN ABORT
      - STARTUP
    expect:
      events:
        - lifecycle.shutdown_abort
        - lifecycle.instance_start
        - recovery.crash_begin        # Beginning crash recovery of N threads
        - recovery.redo_scan          # Started/Completed redo scan
        - recovery.redo_apply         # Started/Completed redo application
        - recovery.crash_end          # Completed crash recovery at
        - lifecycle.db_open
      ora_codes: []
      severity_max: warn
    note: >
      ★ severity 설계의 시험대.
      crash recovery 는 ORA 코드가 하나도 없지만 "비정상 종료가 있었다"는
      중요한 신호다. 반대로 S05 는 ORA 코드가 잔뜩 있지만 계획된 실험이다.
      즉 severity 는 ORA 코드 유무로 정할 수 없다. 이 코퍼스가 그 증거가 된다.
    verify:
      ran_at: 2026-08-06 16:0x
      result: 예측 적중. crash recovery 6줄 모두 확인
      region_lines: 401
      raw: |
        213  Beginning crash recovery of 1 threads
        217  Started redo scan
        219  Completed redo scan
        222  Started redo application at
        228  Completed redo application of 4.39MB
        230  Completed crash recovery at
      rollback_verified: alertlab.crash_t 0건 (커밋 안 된 5000건이 롤백됨)
      findings:
        - |
          ★★★ 비정상 종료가 정상 종료보다 로그를 적게 남긴다.
            S07 (immediate + startup)        439줄
            S08 (abort + startup + recovery) 401줄
          SHUTDOWN ABORT 는 프로세스를 그냥 죽이므로 종료 기록이 거의 없다.
          SHUTDOWN IMMEDIATE 는 약 150줄에 걸쳐 질서정연하게 내려간다.
          crash recovery 18줄이 붙어도 그 차이를 못 메운다.
          → "로그가 많다 = 문제" 라는 직관은 거꾸로다.

          ※ 정정: 처음에 "비정상 종료는 부재로 탐지된다" 고 적었으나 과했다.
            SHUTDOWN ABORT 는 양성 신호를 남긴다:
              Shutting down ORACLE instance (abort) (OS id: N)
              USER (ospid: N): terminating the instance
              Instance terminated by USER, pid = N
              Instance shutdown complete (OS id: N)
            판별자는 "(abort)" vs "(immediate)" 접미사 한 개다.
            부재로만 탐지되는 것은 진짜 크래시(전원 차단·kill -9)이며,
            그 표본은 S00 이 갖고 있다. S00 verify 참조.
        - |
          ★ crash recovery 는 3중 중첩된 open/close 쌍이다.
            Beginning crash recovery of N threads      open
              Started redo scan                          open
              Completed redo scan                        close
              Started redo application at                open
              Completed redo application of N.NMB        close
            Completed crash recovery at                close
          → 사전 스키마의 role: open/close 는 중첩까지 표현해야 한다.
            평평한 짝짓기로는 부족하다.
        - |
          "Completed redo application of 4.39MB" 는 복구량을 숫자로 준다.
          커밋 안 된 5000행(약 2.5MB)에 대해 4.39MB 의 redo 가 적용됐다.
          → 복구 규모를 사람에게 보여줄 수 있는 몇 안 되는 정량 지표.
