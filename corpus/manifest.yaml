          이 한 줄이 "DB 가 곧 멈춘다"의 선언인데 코드가 없다.
          (1번째: S01 cannot allocate new log / 2번째: S05 Linux Error 13 / 3번째: 여기)
        - |
          ★ 문구의 어조와 실제 심각도가 반대다.
            "archiver continuing"  ← 두 번 나옴. 계속한다고 쓰여 있지만 실제로는 정지.
          문구의 낙관적 표현을 신뢰하면 안 된다.
        - |
          프로세스 2개가 각각 에러 스택을 남긴다 (S05 와 같은 구조).
            ARC0 (ora19c_arc0_182821.trc)  → ORA-16038 / 19809 / 00312
            TT00 (ora19c_tt00_182819.trc)  → ORA-19809 / 19804
          겹치는 코드(19809)와 다른 코드가 섞인다.
        - |
          여기서는 "Errors in file ...trc:" 와 ORA 스택이 같은 블록에 있다.
          S03 에서는 두 블록으로 쪼개졌다. 같은 형태가 상황에 따라 갈린다는 것을
          다시 확인. → 블록 경계로 이벤트를 자르면 안 된다.
        - |
          ORA-19804 는 바이트 단위 원시 숫자를 쓴다.
            "cannot reclaim 209715200 bytes disk space from 1887436800 bytes limit"
            1887436800 = 1800M (우리가 설정한 값)
          MB 가 아니라 바이트다. 사람에게 보여줄 때 변환이 필요하다.
        - |
          ★ FRA 는 압박을 받으면 스스로 공간을 회수한다.
            한도를 낮출 때마다 사용량이 4665 → 2697 → 2001MB 로 줄었다.
            진짜 포화는 "회수할 것이 없을 때"만 일어난다.
            → 도구가 FRA 사용량 추이를 볼 때, 사용량 감소가 정상 동작일 수 있다.
        - |
          ORA-00257 은 나오지 않았다.
            그것은 세션이 쓰기를 시도할 때 클라이언트가 받는 에러다.
            여기서는 log switch 에서 먼저 걸려 alert log 쪽 경로로 갔다.
            → 같은 장애라도 어디서 부딪히느냐에 따라 다른 코드가 남는다.

