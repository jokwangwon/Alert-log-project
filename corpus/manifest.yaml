          ARC1 (PID:182841): Archived Log entry 77 added for T-1.S-81 ID 0x4cf47cdf LAD:1
          2026-08-06T15:38:46.578159+09:00
          ARC2 (PID:182843): Archived Log entry 78 added for T-1.S-82 ID 0x4cf47cdf LAD:1
          2026-08-06T15:38:46.604401+09:00
          Thread 1 advanced to log sequence 84 (LGWR switch)
          2026-08-06T15:38:46.614655+09:00
          ARC3 (PID:182845): Archived Log entry 79 added for T-1.S-83 ID 0x4cf47cdf LAD:1
        findings:
