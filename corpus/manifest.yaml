      findings:
        - |
          ★★★ S01 과 완전히 같은 문자열이 여기서는 치명적 의미다.
            S01:  Thread 1 cannot allocate new log, sequence 26
                  Checkpoint not complete                        → 일시적, 자체 해소
            S06:  Thread 1 cannot allocate new log, sequence 84
                  Checkpoint not complete                        → 같은 두 줄
                  Thread 1 cannot allocate new log, sequence 84
                  All online logs need archiving                 → S01 에도 있던 문자열
          두 시나리오가 같은 문자열을 공유한다. 줄 하나로는 severity 판정 불가.

          ★ 코퍼스 전량 대조로 확인한 실제 공유 범위 (처음 추정보다 훨씬 넓다):
                                                      S01(무해)  S06(치명)
            Thread N cannot allocate new log             10        21
            Checkpoint not complete                       9        12
            All online logs need archiving                1         9
            Examine archive trace files for archiving     1         9
