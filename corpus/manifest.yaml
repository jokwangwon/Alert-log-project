          즉 "부가 줄이 다르다"는 것은 사실이 아니다.
          S01 도 에스컬레이션 문구를 전부 한 번씩 찍었고, 스스로 회복했을 뿐이다.

          판별 근거는 둘뿐이다:
            1) 유일한 텍스트 판별자 — "Stuck archiver condition declared" (0 vs 1)
               그리고 이 줄에는 ORA 코드가 없다.
            2) 빈도와 지속성 — 1회 스치고 지나감 vs 9회 반복 (35초 이상 미해소)

          → 3주차 "판단 한 겹" 은 어휘가 아니라
            (a) 단일 결정적 신호의 유무 (b) 반복 횟수 (c) 해소 여부
