# 코퍼스 정답지
#
# 각 시나리오에서 "무엇이 나올 것인가"를 실행 전에 적은 것.
# 실행 후에 로그를 보고 채우면 정답지가 아니라 관찰 기록이 된다.
#
# expect  : 실행 전 예측
# verify  : 실행 후 확인 결과 (실행 뒤에 채운다)
#
# 예측이 빗나간 지점이 가장 값진 발견이다.
# 0주차에 발견한 "ALTER SYSTEM SET 은 Completed: 를 남기지 않는다" 같은 것은
# 예측을 먼저 적어봐야 드러난다.

corpus:
  id: 2026-08-06-run1
  host: ora19c (VirtualBox, 호스트 전용 192.168.56.x)
  db_version: 19.3.0.0.0
  timezone: Asia/Seoul (+09:00)   # 최초 기동 전에 EDT → KST 로 고정함. 수집 내내 불변
  alert_log: /u01/app/oracle/diag/rdbms/ora19c/ora19c/trace/alert_ora19c.log
  marker_prefix: '### '
  collected_at: 2026-08-06

  # ── 수집 결과 ────────────────────────────────────────
  collected:
    file: alert_corpus_20260806.log
    total_lines: 1852
    markers: 17
    labeled_lines: 1481        # 80%
    unlabeled_lines: 371       # 20%
    regions:                   # [시작줄, 끝줄, 줄수]
      S00: [1, 290, 290]
      _gap_a: [291, 399, 109]
      S01: [400, 543, 144]
      S02: [545, 552, 8]
      S03: [554, 560, 7]
      S04: [562, 577, 16]
      S05: [584, 608, 25]
      S06: [615, 1009, 395]
      S07: [1011, 1327, 317]
      _gap_b: [1328, 1451, 124]
      S08: [1452, 1730, 279]
      _gap_c: [1731, 1852, 122]

    # ★ 마커는 이벤트 경계를 정확히 자르지 못한다 — 반드시 알고 써야 할 한계
    labeling_limitation: |
      큰 미라벨 구간 3개(_gap_a/b/c, 각 109·124·122줄)가 전부 기동 직후에 있다.
      STARTUP 이 반환된 직후 END 마커를 찍지만, Oracle 은 그 뒤로도 2분 가까이
      기동 관련 기록을 계속 쓴다 (FRA 사용량 보고, 스케줄러 윈도우,
      리소스 매니저 플랜 설정 등).
      → "Database opened" 는 기동의 끝이 아니다.
      → 이 구간들은 실질적으로 S00/S07/S08 의 연장이지만 라벨이 없다.
        빈 구간을 "아무 일 없음"으로 읽으면 안 된다.
      → 다음 수집 때 개선: STARTUP 후 60초 대기하고 END 마커를 찍는다.

  # 수집 시작 시점의 상태 (00_setup.out 기준)
  baseline:
    log_mode: ARCHIVELOG
    open_mode: READ WRITE
    sga_target_mb: 1088
    fra_limit_mb: 8256            # ★ S06 원복값
    fra_used_mb: 3000
    redo_groups: 3
    redo_size_mb: 200
    redo_members_per_group: 1
    health_check: 전부 통과 (v$recover_file 등 4개 쿼리 no rows)

# severity 척도
#   noise    통째로 숨겨도 되는 정보성 반복
#   info     정상 동작의 기록
#   notice   사람이 알아둘 만한 상태 변화 (기동/정지)
#   warn     정상은 아니나 DB가 스스로 처리함
#   error    작업 하나가 실패함
#   critical DB 전체가 멈추거나 데이터가 위험함

scenarios:

  - id: S00
    slug: cold-startup
    boundary: [로그 시작, '### S00 END cold-startup']
    commands:
      - startup
    expect:
      events:
        - lifecycle.instance_start
        - lifecycle.env_dump          # SGA 덤프 · pagesize 표 · LICENSE_MAX_SESSION
        - lifecycle.bg_process_start  # PMON/SMON/LGWR/CKPT ... 30여 개
        - lifecycle.db_mount
        - lifecycle.db_open
      ora_codes: []
      severity_max: notice
    note: >
      DB가 꺼진 상태라 BEGIN 마커를 못 박는다. 로그 시작 자체가 경계.
      ORA-00800(VKTM priority)이 나올 수 있는데 VM 환경 경고이며 무해하다.
    verify:
      ran_at: 2026-08-06 14:04
      result: ★ 예측 빗나감 — 깨끗한 기동이 아니었다
      findings:
        - |
          ★★ S00 은 crash recovery 를 포함한다. severity_max: notice 는 오답이다.
            207: Beginning crash recovery of 1 threads
            211: Started redo scan
            222: Completed redo application of 5.37MB
            224: Completed crash recovery at
          이 VM 의 DB 는 배포 전에 비정상 종료된 상태였다
          (이미지가 전원이 꺼진 채로 만들어짐).
          → S00 은 "정상 기동" 표본이 아니다. 그 역할은 S07 만 한다.
        - |
          ★★★ 계획에 없던 가장 값진 표본.
            S00 직전의 종료는 alert log 에 아무 기록도 남기지 않았다.
            (이전 로그를 mv 로 치웠으니 애초에 이 로그에는 없다 —
             하지만 "종료 기록 없이 시작하는 로그" 라는 형태 자체가 실전 그대로다)
            SHUTDOWN ABORT(S08)는 의도된 중단이라 Oracle 이 기록할 틈이 있지만,
            전원 차단·OS 크래시·kill -9 는 그럴 틈이 없다.
          → 종료는 세 종류다:
              immediate   "(immediate)" + 약 70줄   / 다음 기동에 recovery 없음  [S07]
              abort       "(abort)"     + 4줄       / 다음 기동에 recovery 있음  [S08]
              진짜 크래시  기록 전무                  / 다음 기동에 recovery 있음  [S00 직전]
            "부재가 신호" 는 abort 가 아니라 세 번째 경우에만 해당한다.

  - id: S01
    slug: log-switch-x20
    commands:
      - ALTER SYSTEM SWITCH LOGFILE   # x20
    expect:
      events:
        - checkpoint.log_switch       # Beginning log switch checkpoint
        - archive.log_switch          # Thread 1 advanced to log sequence N (LGWR switch)
        - archive.archived            # Archived Log entry N added for T-1.S-N
        - checkpoint.completed
      ora_codes: []
      severity_max: info
      count_hint: 스위치 20회당 위 4종이 각각 20회 안팎
      maybe:
        # redo 그룹이 3개(200MB)뿐이라 20회를 빠르게 돌리면
        # ARCH 가 아카이빙을 못 따라갈 수 있다. 그러면 아래가 나온다:
        #   Thread 1 cannot allocate new log, sequence N
        #   Checkpoint not complete       (또는 All online logs need archiving)
        - archive.log_contention
      severity_if_maybe: warn
    note: >
      정상 이벤트를 싸게 대량 확보하는 것이 목적. 노이즈 분포의 기준선이 된다.
      단 archive.log_contention 이 나오면 그건 오염이 아니라 이 시나리오의
      정당한 결과다 — "정상 동작의 반복이 부하가 되는 지점"이라는
      severity 판단의 좋은 재료가 된다. 나오면 verify 에 기록할 것.
    verify:
      ran_at: 2026-08-06 14:2x
      result: 예측 적중 (maybe 항목 포함)
      counts:
        advanced_to_log_sequence: 21    # 20 (LGWR switch) + 1 (thread open, S00 기동분)
        archived_log_entry: 21
        cannot_allocate_new_log: 10
      contention_reasons:               # 다음 줄에 붙는 이유. 변종 2종 모두 확보됨
        Checkpoint not complete: 9      #   DBWR 가 못 따라감
        All online logs need archiving: 1  # ARCH 가 못 따라감
      findings:
        - |
          ★ Thread 1 cannot allocate new log 에는 ORA 코드가 없다.
            그런데 명백한 경고다. parse.py 의 has_ora 기준으로는
            이 사건이 통째로 보이지 않는다.
            → severity 는 ORA 코드 유무로 정할 수 없다는 첫 실물 증거.
        - |
          ★ 같은 첫 줄이라도 다음 줄(이유)에 따라 조치가 달라진다.
            Checkpoint not complete 와 All online logs need archiving 은
            원인도 대응도 다르다.
            → 이벤트의 단위는 한 줄이 아니라 "줄의 묶음"이어야 한다.
        - |
          advanced to log sequence 는 접미사로 갈린다:
            (LGWR switch)  = 사용자/자동 로그 스위치
            (thread open)  = 인스턴스 기동 시 최초 오픈
            → 사전에서 별개 타입으로 분리할 것.

  - id: S02
    slug: rman-backup
    commands:
      - RMAN> BACKUP DATABASE
    expect:
      events:
        - backup.autobackup           # Control autobackup written to DISK device
        - archive.archived
      ora_codes: []
      severity_max: info
    note: >
      0주차 분석에서 "구조 변경 5~7분 뒤에 자동백업이 기록된다"고 관찰했다.
      여기서는 명시적 백업이므로 지연 없이 기록될 것으로 예측한다. 대조해볼 것.
    verify:
      ran_at: 2026-08-06 14:20
      result: 예측 적중
      timeline:
        - 14:20:01  RMAN BACKUP DATABASE 시작
        - 14:20:06  Control autobackup written to DISK device   # 지연 5초
        - 14:20:17  '### S02 END'
      findings:
        - |
          ★ 0주차 의문 해소.
            0주차: 구조 변경(CREATE TABLESPACE 등) → 5~7분 뒤 자동백업 기록
            여기:  명시적 RMAN BACKUP        → 5초 뒤 기록
            지연은 자동백업의 성질이 아니라 "암묵적 트리거"의 성질이었다.
            같은 이벤트라도 무엇이 유발했느냐에 따라 시간 간격이 달라진다.
        - |
          ★ 범위 한계 발견.
            RMAN 은 데이터파일 4개를 백업했지만 alert log 에는
            Control autobackup 한 줄만 남았다. 백업셋 생성은 기록되지 않는다.
            → alert log 만으로는 백업의 성공/실패를 판정할 수 없다.
              이 도구가 답할 수 없는 질문으로 명시할 것.
        - |
          블록 중간에 빈 줄이 들어간다 (0주차 관찰 재확인).
            Control autobackup written to DISK device
            <빈 줄>
            handle '/u01/.../o1_mf_s_...bkp'
          - handle 줄은 앞 줄에 딸린 연속 줄이다 → 이벤트는 줄의 묶음 (S01 에 이어 2번째 증거)
          - parse.py 는 `if not line: continue` 로 빈 줄을 버린다.
            블록 경계 판정에는 무해하지만 raw_lines 가 원문을 그대로 담지 못한다.

  - id: S03
    slug: deadlock
    commands:
      - 세션A UPDATE id=1 / 세션B UPDATE id=2 / 세션A UPDATE id=2 / 세션B UPDATE id=1
    expect:
      events:
        - fault.deadlock
      ora_codes: [ORA-00060]
      severity_max: error
      shape: |
        ORA-00060: Deadlock detected. More info in file <trace path>.
        → trace 파일 경로를 동반하는 형태. fault.incident 와 같은 계열이나
          "Errors in file ... (incident=N)" 머리말이 없을 수 있다.
    note: alert log 에 남는 형태가 incident 형인지 단독 한 줄인지가 확인 포인트.
    verify:
      ran_at: 2026-08-06 14:59:53
      result: 발생 확인. 단 형태가 예상과 다름
      raw: |
        2026-08-06T14:59:53.418573+09:00
        Errors in file /u01/app/oracle/diag/rdbms/ora19c/ora19c/trace/ora19c_ora_190897.trc:
        2026-08-06T14:59:53.496460+09:00
        ORA-00060: Deadlock detected. See Note 60.1 at My Oracle Support for
        Troubleshooting ORA-60 Errors. More info in file /u01/.../ora19c_ora_190897.trc.
      findings:
        - |
          ★★ 하나의 에러가 두 블록으로 쪼개진다 (78ms 차이).
            parse_blocks 로 돌려본 실제 결과:
              block 0  has_ora=False  "Errors in file ...trc:"
              block 1  has_ora=True   "ORA-00060: Deadlock detected..."
            "이건 에러다"를 알려주는 헤더가 has_ora=False 라서
            현재 필터에서 통째로 사라진다.
        - |
          ★★ 같은 종류의 에러가 때로는 1블록, 때로는 2블록이다.
            0주차 ORA-00800 은 헤더/코드/상세가 한 블록 안에 있었다.
            여기 ORA-00060 은 헤더와 코드가 다른 블록이다.
            → 블록 경계는 이벤트 경계가 아니다. 확정.
            → 병합 규칙이 필요하다. 시간 근접만으로 붙이면 위험하므로
              (0주차 교훈: 시간 순서 != 인과) 내용 기반으로 간다:
              "Errors in file <path>:" 처럼 콜론으로 끝나는 헤더는
              다음 블록의 첫 줄과 이어진다.
        - |
          "Errors in file" 헤더에 변종 2종:
            ORA-00800:  Errors in file <path>  (incident=487446):   ← incident 번호 있음
            ORA-00060:  Errors in file <path>:                      ← 없음
        - |
          ★ 정규식 함정.
            ORA-00060 의 메시지 본문에 "Troubleshooting ORA-60 Errors" 라는
            문자열이 들어 있다. 현재 ORA-\d{3,5} 가 2자리를 안 잡아서 우연히 막혔다.
            \d{2,5} 로 넓혔다면 한 줄에서 코드 2개를 잡아 오탐이 났을 것.
            → ORA 코드 추출은 "줄 어디든" 이 아니라 "줄 머리" 로 제한하는 편이 안전하다.
        - trace 파일 경로가 헤더와 본문에 중복 등장한다. 같은 사건이라는 단서로 쓸 수 있다.

  - id: S04
    slug: tablespace-extend-fail
    commands:
      - CREATE TABLESPACE ts_small DATAFILE SIZE 10M AUTOEXTEND OFF
      - INSERT 대량 → 실패
      - ALTER DATABASE DATAFILE ... RESIZE 30M
    expect:
      events:
        - ddl.command
        - ddl.completed
        - space.extend_fail           # ← alert log 기록 여부 자체가 불확실
      ora_codes: [ORA-01653]
      severity_max: error
      uncertain: true
    note: >
      ★ 검증 대상: ORA-01653 이 alert log 에 기록되는가?
      세션 에러로만 끝나고 alert log 에는 안 남을 가능성이 있다.
      "안 남는다"도 유효한 결과다 — 도구가 공간 부족을 alert log 만으로는
      탐지할 수 없다는 뜻이 되므로 범위 결정에 직접 영향을 준다.
    verify:
      ran_at: 2026-08-06 15:03
      result: |
        첫 시도가 통째로 실패했다. 이 VM 에는 db_create_file_dest 가 없어
        (OMF 미설정) 경로 없는 CREATE TABLESPACE 가 ORA-02236 으로 거부됨.
        앞 VM 에서 되던 이유는 파일명 o1_mf_test_ts_*.dbf 가 말해준다 — OMF 였다.
        ★ 그런데 이 실패가 계획된 시나리오보다 값진 발견을 냈다. 아래 참조.
        S04 BEGIN 마커는 이미 찍혀 있어 구간 안에 실패한 첫 시도가 포함된다.
      raw: |
        ### S04 BEGIN tablespace-extend-fail
        2026-08-06T15:03:15.681103+09:00
        ALTER DATABASE DATAFILE '' RESIZE 30M
        ORA-7202 signalled during: ALTER DATABASE DATAFILE '' RESIZE 30M...
      findings:
        - |
          ★★ 실패한 DDL 중 일부만 alert log 에 남는다.
            CREATE TABLESPACE ... SIZE 10M   ORA-02236  → 기록 없음
            ALTER USER ... QUOTA ON          ORA-00959  → 기록 없음
            CREATE TABLE ... TABLESPACE      ORA-00959  → 기록 없음
            ALTER DATABASE DATAFILE '' RESIZE ORA-07202 → 기록됨
          경계는 "파싱/검증에서 거부" vs "실행 중 실패" 다.
          실행이 시작된 명령만 alert log 에 들어간다.
          0주차의 ORA-7345 / ORA-376 도 전부 실행 단계 실패였다.
          → 범위 한계 2: alert log 로는 "시도했다가 실패한 명령"을 온전히 볼 수 없다.
            (범위 한계 1 은 S02 의 백업 성공/실패)
        - |
          ★★ 제로패딩 차이가 통제된 조건에서 실증됨.
            세션 에러:  ORA-07202
            alert log:  ORA-7202 signalled during: ...
          63MB 로그에서 ORA-00313 / ORA-313 이 함께 나오던 것을 보고
          "표기 규칙이 두 개"라고 추정했는데, 여기서 같은 사건의 두 표기를
          동시에 관찰했다. 추정이 아니라 확인이 되었다.
          → 코드 정규화는 필수. f"ORA-{int(n):05d}"
        - |
          실패한 DDL 도 성공과 같은 2줄 구조를 갖는다 (0주차 관찰 재확인).
            명령 원문 → ORA-nnnn signalled during: <명령 원문>...
          다만 뒤에 "..." 가 붙어 원문이 잘린다. 원문 대조로 짝을 지으려면
          접두 일치를 써야 한다.

      # ── 재실행 (경로 명시) ────────────────────────────
      rerun:
        ran_at: 2026-08-06 15:08:52
        result: 원래 질문 해결 — ORA-1653 은 alert log 에 기록된다 (uncertain 해소)
        raw: |
          2026-08-06T15:08:52.113897+09:00
          CREATE TABLESPACE ts_small
            DATAFILE '/u01/app/oracle/oradata/ORA19C/ts_small01.dbf' SIZE 10M AUTOEXTEND OFF
          Completed: CREATE TABLESPACE ts_small
            DATAFILE '/u01/app/oracle/oradata/ORA19C/ts_small01.dbf' SIZE 10M AUTOEXTEND OFF
          2026-08-06T15:08:52.444151+09:00
          ORA-1653: unable to extend table ALERTLAB.FILL_T by 128 in tablespace TS_SMALL
          ALTER DATABASE DATAFILE '/u01/.../ts_small01.dbf' RESIZE 30M
          Resize operation completed for file# 5, old size 10240K, new size 30720K
          Completed: ALTER DATABASE DATAFILE '/u01/.../ts_small01.dbf' RESIZE 30M
        findings:
          - |
            ★ ORA-1653 은 기록된다. DML 실행 중 실패도 alert log 에 남는다.
              단 제로패딩 없음 (ORA-1653). 그리고 signalled during 형식이 아니라
              메시지 단독 한 줄이다. 짝지을 명령이 없다.
          - |
            ★★ 명령 원문이 여러 줄일 수 있다.
              SQL 을 두 줄로 작성하면 Oracle 이 개행까지 그대로 기록한다.
              Completed: 도 같은 형태로 여러 줄이 된다.
              현재 message 는 첫 줄만 잡으므로 "CREATE TABLESPACE ts_small" 로 끝나
              무슨 명령인지 알 수 없게 된다.
              → "한 줄 = 한 이벤트" 가정이 깨진다. 이어지는 줄은 들여쓰기(공백 시작)가 단서.
          - |
            ★★ 한 블록에 서로 무관한 사건 4개가 들어 있다.
              ORA-1653 (공간 부족) / ALTER DATABASE (별개 명령) /
              Resize 결과 상세 / Completed:
              이 블록 하나가 1.35초를 담고 있다.
              → S03 은 한 이벤트가 두 블록으로 쪼개졌고, 여기는 한 블록에 네 이벤트다.
                블록은 이벤트가 아니라 시간 묶음일 뿐이라는 것이 양방향으로 증명됨.
          - |
            에러 기록 형태가 4종으로 확정됨:
              1) Errors in file <path>  (incident=N):  + ORA   [ORA-00800, 0주차]
              2) Errors in file <path>:  + 다음 블록에 ORA      [ORA-00060, S03]
              3) ORA-nnnn signalled during: <명령>...           [ORA-7202,  S04]
              4) ORA-nnnn: <메시지>  단독                        [ORA-1653,  S04]
            0주차에 "성공은 Completed:, 실패는 signalled during:" 이라고 정리했는데
            실패 쪽은 실제로 4가지다.

  - id: S05
    slug: datafile-permission-denied
    commands:
      - ALTER TABLESPACE ts_small OFFLINE
      - chmod 000 <datafile>
      - ALTER TABLESPACE ts_small ONLINE    # 실패
      - chmod 640 <datafile>
      - ALTER TABLESPACE ts_small ONLINE    # 성공
    expect:
      events:
        - ddl.command
        - ddl.failed
        - fault.media
        - ddl.completed
      ora_codes: [ORA-01157, ORA-01110, ORA-27041]
      severity_max: critical
      shape: |
        여러 ORA 코드가 한 블록에 스택으로 쌓인다.
        ORA-01157 ← ORA-01110 ← ORA-27041 ← "Linux-x86_64 Error: 13: Permission denied"
    note: >
      ★ 이 시나리오가 코퍼스의 핵심이다.
      같은 명령(ALTER TABLESPACE ONLINE)이 실패 → 성공으로 두 번 나오므로,
      "명령 원문만으로는 성패를 알 수 없고 결과 줄을 봐야 한다"는
      상관분석의 근거가 된다.
      또 ORA 코드가 스택으로 쌓이는 형태는 "코드 개수 = 사건 개수가 아니다"의 증거다.
    verify:
      ran_at: 2026-08-06 15:16:41
      result: 예측 적중. 예상보다 풍부함 — 코퍼스에서 가장 밀도 높은 구간
      raw: |
        ### S05 BEGIN datafile-permission-denied
        ALTER TABLESPACE ts_small OFFLINE
        Completed: ALTER TABLESPACE ts_small OFFLINE
        ALTER TABLESPACE ts_small ONLINE
        2026-08-06T15:16:41.501950+09:00
        Errors in file /u01/.../ora19c_dbw0_182740.trc:
        ORA-01157: cannot identify/lock data file 5 - see DBWR trace file
        ORA-01110: data file 5: '/u01/.../ts_small01.dbf'
        ORA-27041: unable to open file
        Linux-x86_64 Error: 13: Permission denied
        Additional information: 9
        ORA-1157 signalled during: ALTER TABLESPACE ts_small ONLINE...
        2026-08-06T15:16:41.547696+09:00
        Errors in file /u01/.../ora19c_mz00_209967.trc:
        ORA-01110: data file 5: '/u01/.../ts_small01.dbf'
        ORA-01565: error in identifying file '/u01/.../ts_small01.dbf'
        ORA-27041: unable to open file
        Linux-x86_64 Error: 13: Permission denied
        Additional information: 9
        Checker run found 3 new persistent data failures
        2026-08-06T15:16:51.521967+09:00
        ALTER TABLESPACE ts_small ONLINE
        Completed: ALTER TABLESPACE ts_small ONLINE
      findings:
        - |
          ★★★ 같은 ORA 코드가 한 블록 안에 두 표기로 공존한다.
            ORA-01157: cannot identify/lock data file 5 ...      (스택 구성원)
            ORA-1157 signalled during: ALTER TABLESPACE ...      (명령의 결과)
          제로패딩 문제의 결정적 증거. 추정이 아니라 같은 블록 안의 사실이다.
          두 표기는 역할도 다르다 — 패딩형은 에러 스택의 일부,
          비패딩형은 명령과 짝지어진 결과 줄.
          → 정규화 없이는 같은 에러를 둘로 센다.
        - |
          ★★★ 사용자 명령 1건에 프로세스 2개가 각각 에러 스택을 남긴다.
            15:16:41.501950  DBW0 (ora19c_dbw0_182740.trc)  → 01157 / 01110 / 27041
            15:16:41.547696  MZ00 (ora19c_mz00_209967.trc)  → 01110 / 01565 / 27041
          46ms 차이, 서로 다른 트레이스 파일, 겹치면서도 다른 코드 조합.
          사건 1건 = ORA 코드 6개 = 스택 2개 = 블록 2개.
          → 63MB 로그의 ORA-00312/00313/27041 이 각각 13만 번이던 구조가 이것이다.
            "중복 억제"가 억제해야 할 대상의 실물.
          → 같은 사건으로 묶는 단서: 근접 시각 + 공통 데이터파일 경로.
        - |
          ★★ 근본 원인이 ORA 코드가 아닌 줄에 있다.
            ORA-27041: unable to open file          ← 증상
            Linux-x86_64 Error: 13: Permission denied  ← 원인
            Additional information: 9
          왜 못 여는지(권한/파일없음/I-O)를 결정하는 정보가 ORA 정규식 밖에 있다.
          조치가 갈리는 지점이 정작 코드 밖이다.
        - |
          같은 명령 원문이 실패와 성공으로 두 번 나온다.
            15:16:41  ALTER TABLESPACE ts_small ONLINE  → ORA-1157 signalled
            15:16:51  ALTER TABLESPACE ts_small ONLINE  → Completed:
          명령 원문만으로는 성패를 알 수 없다. 결과 줄을 봐야 한다. (예측대로)
        - |
          Checker run found 3 new persistent data failures
          0주차에 정체를 몰라 남겨둔 줄. media failure 후 Health Checker 가
          자동으로 돌고 남기는 요약이다.
          ★ 파일 하나를 건드렸는데 "3 new" 로 센다.
            Oracle 내부의 실패 카운트와 사람이 세는 사건 수는 다르다.
        - |
          마커는 새 타임스탬프 블록을 만들지 않는다.
            '### S05 BEGIN' 과 뒤따르는 명령 3줄이 한 블록에 들어 있고,
            그 블록의 타임스탬프는 마커보다 앞이다.
          → 마커는 블록 경계와 일치하지 않는다. 라벨 구간을 자를 때
            "마커 줄 자체" 기준으로 잘라야지 블록 단위로 자르면 어긋난다.
        - |
          타임스탬프 블록의 시간 폭이 넓다.
            S04: 한 블록이 1.35초를 담음
            S05: OFFLINE~ONLINE 시도까지 여러 초가 한 블록
          → 블록 = 고정 시간 단위가 아니다. Oracle 이 쓰기 배치마다 헤더를 낸다.

  - id: S06
    slug: fra-full
    commands:
      - ALTER SYSTEM SET db_recovery_file_dest_size = <used+20>M
      - ALTER SYSTEM SWITCH LOGFILE   # 반복 → 정지
      - ALTER SYSTEM SET db_recovery_file_dest_size = <원래값>   # 해소
    expect:
      events:
        - archive.stuck
        - fault.space_exhausted
        - archive.resumed
      ora_codes: [ORA-19809, ORA-19804, ORA-00257]
      severity_max: critical
      shape: |
        ARCH: Archival stopped, error occurred. Will continue retrying
        ORA-16038 / ORA-19809: limit exceeded for recovery files
        → 해소 후 아카이빙 재개 메시지
    note: >
      실무 최다 장애. "DB가 멈춘다"는 결과의 심각도가 다른 시나리오와
      질적으로 다르다는 것을 코퍼스에 담는 것이 목적.
      장애 발생과 해소가 한 구간 안에 들어 있어 복구 판정 규칙의 재료가 된다.
    verify:
      ran_at: 2026-08-06 15:37:10
      result: 예측 적중. 코퍼스에서 가장 중요한 구간
      how: |
        한도를 used+20M 로 조이는 방법은 실패했다. Oracle 이 압박을 감지하고
        회수 가능한 파일을 자동으로 지워버려 여유가 계속 생겼다.
          4665MB 사용 → 한도 4686M 설정 → 2697MB 로 감소
                     → 한도 4000M 설정 → 2001MB 로 감소
        회수 불가능한 바닥(S02 의 BACKUP PIECE 약 1660MB) 바로 위인
        1800M 으로 조이자 세 번째 log switch 에서 정지했다.
      raw: |
        2026-08-06T15:37:10.772353+09:00
        ARC0 (PID:182821): Error 19809 Creating archive log file to '/u01/.../o1_mf_1_81_%u_.arc'
        ARC0 (PID:182821): Stuck archiver: inactive mandatory LAD:1
        ARC0 (PID:182821): Stuck archiver condition declared
        2026-08-06T15:37:10.786726+09:00
        Errors in file /u01/.../ora19c_arc0_182821.trc:
        ORA-16038: log 3 sequence# 81 cannot be archived
        ORA-19809: limit exceeded for recovery files
        ORA-00312: online log 3 thread 1: '/u01/.../redo03.log'
        ARC0 (PID:182821): Archival error occurred on a closed thread, archiver continuing
        2026-08-06T15:37:10.786765+09:00
        ORACLE Instance ora19c, archival error, archiver continuing
        2026-08-06T15:37:11.356788+09:00
        Thread 1 advanced to log sequence 83 (LGWR switch)
